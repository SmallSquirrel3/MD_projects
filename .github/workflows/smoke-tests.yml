name: smoke-tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v5
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
      - name: Run every project in --quick mode
        run: bash run_smoke_tests.sh
